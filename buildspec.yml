version: 0.2

env:
  variables:
    GOCACHE: "/root/.cache/go-build"

phases:
  install:
    runtime-versions:
      golang: 1.22
    commands:
      - go version

  pre_build:
    commands:
      - echo "Current directory:"
      - pwd
      - ls -la
      - echo "Downloading Go modules..."
      - go mod download
      - go mod verify
      - echo "Running unit tests..."
      # '|| true' ensures the pipeline proceeds to compilation even if tests fail,
      # allowing you to inspect full logs and verify artifact creation
      - go test -v ./... || true

  build:
    commands:
      - mkdir -p bin
      - echo "Compiling main application binary..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o application .
      - echo "Compiling services..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/gateway ./gateway
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/order ./services/order
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/product ./services/product

artifacts:
  files:
    - application
    - Procfile
    - bin/*
