version: 0.2

env:
  variables:
    GOCACHE: "/root/.cache/go-build"

phases:
  install:
    runtime-versions:
      golang: 1.27
    commands:
      - go version

  pre_build:
    commands:
      - pwd
      - ls -la
      - go mod download
      - go mod verify
      - go test -v ./...

  build:
    commands:
      - mkdir -p bin
      - echo "Compiling root application binary..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o application .
      - echo "Compiling gateway service..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/gateway ./gateway
      - echo "Compiling order service..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/order ./services/order
      - echo "Compiling product service..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/product ./services/product

artifacts:
  files:
    - application
    - Procfile
    - bin/*
